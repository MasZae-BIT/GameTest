<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tebak Cepat</title>
<style>
  :root{--bg:#0f1115;--surface:#1a1d24;--text:#f2f3f5;--sub:#9aa0ab;--accent:#4f8cff;--red:#e21b3c;--blue:#1368ce;--yellow:#d89e00;--green:#26890c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
  h1{font-size:20px;margin:0}
  .hint{color:var(--sub);font-size:13px;max-width:420px;margin:0}
  .room-code{font-size:48px;font-weight:800;letter-spacing:8px;color:var(--accent)}
  #qrBox{background:#fff;padding:12px;border-radius:14px}
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:480px}
  .slot{background:var(--surface);border-radius:12px;padding:12px;min-height:60px;font-size:13px}
  .slot.empty{color:var(--sub);border:1px dashed #2a2e38;display:flex;align-items:center;justify-content:center}
  .score{font-size:22px;font-weight:800;color:var(--accent)}
  button{background:var(--accent);color:#fff;border:none;padding:14px 28px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  .qtext{font-size:24px;font-weight:700;max-width:560px}
  .timer{font-size:14px;color:var(--sub)}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:480px}
  .opt{border-radius:12px;padding:16px;font-size:16px;font-weight:700;color:#fff}
  .red{background:var(--red)}.blue{background:var(--blue)}.yellow{background:var(--yellow)}.green{background:var(--green)}
  .board{width:100%;max-width:480px;text-align:left}
  .brow{display:flex;justify-content:space-between;background:var(--surface);padding:10px 14px;border-radius:10px;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="hint">Menyambung ke server…</p></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const app = document.getElementById('app');
const COLORS = ['red','blue','yellow','green'];
const base = (window.GAMEKUIS_SERVER || location.origin).replace(/^http/, 'ws').replace(/\/$/, '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ws, code = '', players = [], timer = null;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function connect(){
  ws = new WebSocket(base + '/ws');
  ws.onopen = () => send({ type: 'host_create' });
  ws.onclose = () => { clearInterval(timer); app.innerHTML = '<p class="hint">Koneksi terputus. Reload halaman untuk membuat room baru.</p>'; };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'room_created') { code = m.room; lobby(); }
    else if (m.type === 'players') { players = m.players; if (document.getElementById('slots')) renderSlots(); }
    else if (m.type === 'question') question(m);
    else if (m.type === 'answered_count') { const t = document.getElementById('cnt'); if (t) t.textContent = m.count + '/' + m.total + ' sudah menjawab'; }
    else if (m.type === 'reveal') reveal(m);
    else if (m.type === 'final') final(m);
  };
}

function lobby(){
  app.innerHTML = `<h1>🧠 Tebak Cepat</h1><div class="room-code">${code}</div><div id="qrBox"></div>
    <p class="hint">Scan QR lewat app GameController. Maksimal 4 pemain.</p>
    <div class="slots" id="slots"></div><button id="startBtn" disabled>Mulai Kuis</button>`;
  new QRCode(document.getElementById('qrBox'), { text: base + '/ws?room=' + code, width: 170, height: 170 });
  document.getElementById('startBtn').onclick = () => send({ type: 'start' });
  renderSlots();
}

function renderSlots(){
  const el = document.getElementById('slots'); el.innerHTML = '';
  for (let i = 0; i < 4; i++){
    const p = players[i], d = document.createElement('div');
    if (!p){ d.className = 'slot empty'; d.textContent = 'Menunggu Pemain ' + (i + 1) + '…'; }
    else { d.className = 'slot'; d.innerHTML = `<div>${esc(p.name)}</div><div class="score">${p.score}</div>`; }
    el.appendChild(d);
  }
  document.getElementById('startBtn').disabled = !players.some(p => p.connected);
}

function question(m){
  clearInterval(timer);
  let left = m.seconds;
  app.innerHTML = `<p class="hint">Soal ${m.index + 1} / ${m.total}</p><div class="qtext">${esc(m.text)}</div>
    <div class="timer" id="t">⏱ ${left}s</div><div class="timer" id="cnt"></div>
    <div class="options">${COLORS.map(c => `<div class="opt ${c}">${esc(m.options[c])}</div>`).join('')}</div>`;
  timer = setInterval(() => { left--; const t = document.getElementById('t'); if (t) t.textContent = '⏱ ' + Math.max(left, 0) + 's'; if (left <= 0) clearInterval(timer); }, 1000);
}

function reveal(m){
  clearInterval(timer);
  app.innerHTML = `<div class="qtext">Jawaban benar: <b>${esc(m.correctText)}</b></div>
    <div class="board">${m.scores.map(p => `<div class="brow"><span>${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}</div>
    <button id="nextBtn">${m.last ? 'Lihat Hasil Akhir' : 'Soal Berikutnya'}</button>`;
  document.getElementById('nextBtn').onclick = () => send({ type: 'next' });
}

function final(m){
  app.innerHTML = `<div class="qtext">🏆 Hasil Akhir</div>
    <div class="board">${m.ranking.map((p, i) => `<div class="brow"><span>${i + 1}. ${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}</div>
    <button id="again">Main Lagi</button>`;
  document.getElementById('again').onclick = () => send({ type: 'restart' });
}
connect();
</script>
</body>
</html>
